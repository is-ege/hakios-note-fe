# devices/gracerlte/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device gracerlte
	title       Galaxy Note FE
	vendor      Samsung
	soc         exynos8890
	defconfig   gracerlte_defconfig
	maintainer  Ege (README.md)
	status      display     works     DECON_F in command mode, each frame at the panel's TE, 60 a second (decon_vclk42=1 from tools/mkboot.sh: VCLK0 at Samsung's 42 MHz); iOS drawn at 1035 x 1840 (414 x 736 points, fb_nativeui=2) into three buffers G1 reads (fb_dpp=1, the SoC config's), enlarged to 1080 x 1920 by the S6E3HA5's own scaler (Samsung's FHD mode, BA 02) inside its 1440 x 2560, a thin black border; brightness from Control Center (panel=1 brightness_bridge=1; the AOR only, S-Boot's level the brightest); home screen swipes 57 fps, seen on the phone, 12 November
	status      usb         works     the kernel's log and a line console on the host's /dev/cu.usbmodem* (usb_gadget=5 usb_gadget_soc=exynos8890, defaults; the MUIC's switch to the AP, max77854_usbsw=1, from tools/mkboot.sh): DWC3 at high speed, Samsung's USB3 CAL sequence for the PHY; seen on the phone, 8 November
	status      cpu         partial   the four M1s run the kernel (cpus=4 bootcpu=4, defaults): CPU_ON through the loader's trampoline below 4 GB, then the PMU powers the core (EXYNOS8890_CPU); the A53s stay the loader's (they need a 4 KB-page kernel: parked); the M1s' rate governed (cpufreq_gov=1, a default) from 728 MHz idle to 2288 MHz, BUCK2 675 to 1012.5 mV (Samsung's table and this chip's ASV), with touch and frame boosts, at most 1560 MHz while the GPU runs above 600 (Samsung's rule; the GPU stays at 546), cooled from 76 C by the SoC's own temperatures (tmu=3, a default; the run ends at 110 C)
	status      storage     works     the UFS controller as S-Boot left it, taken by the kernel's own driver (ufs_native=4, defaults): /dev/ufs_NAME for 24 partitions; iOS's system read from SYSTEM (system_apfs=ufs_SYSTEM), /private/var a journaled HFSX volume in USERDATA kept between boots (ufs_native_ro=0 ufs_native_write=USERDATA var_hfs=ufs_USERDATA_data from tools/mkboot.sh; the one partition written, synced at a run's end); seen on the phone, 11 November
	status      touch       works     the S6SY661 on HSI2C7 (s6sy761=1 s6sy761_board=gracerlte, defaults; drivers/input/hakios.s6sy761.c with the older sec_ts command set), its supplies LDO32/LDO33 of the S2MPS16 switched on (s2mps16_tsp=1 from tools/mkboot.sh; approved by Ege): taps land where pressed, events every 10-20 ms; seen on the phone, 8 November
	status      gpu         works     the Mali-T880 MP12 (r2p0), the G3D domain on as S-Boot leaves it, through the Mali driver's 8890 glue (mali=9 mali_soc=exynos8890; soc/drivers/core/hakios.exynos8890_g3d.c), served to programs (HakiosMali); Mesa 25.0.7's panfrost (Midgard, OpenGL ES 3.1) draws every frame of the window server (GL=1); its clock after its load between 260 and 546 MHz with Samsung's supplies for this chip (mali_mhz=546 mali_gov=1 mali_gov_frame=546 from tools/mkboot.sh; 650 left out: it locks the M1s to 1560 MHz), capped by the G3D's temperature; no Metal
	status      buttons     works     power, volume, Home: ALIVE GPIO pins, only read (exynos_keys=1 exynos_keys_board=gracerlte, defaults; drivers/input/hakios.exynos_keys.c): power locks and wakes, Home goes home; volume read but unused by iOS without audio; seen on the phone, 8 November
	status      battery     works     the MAX77854's fuel gauge and charger state read every 5 s (max77854=1 from tools/mkboot.sh, HAKIOS_BATTERY): level, charging and the battery's temperature in the status bar; read only, the charger never written; seen on the phone, 10 November
	status      wifi        works     the BCM4359 on the 8890's PCIe (wifi_pcie=6 brcmfmac=8 wifi_nvram=nvram.txt_murata_c0_plus from tools/mkboot.sh) with Linux's brcmfmac and Samsung's firmware from the phone's own stock image (core/fw-wifi/, never in the repository): scans and joins a network; seen on the phone, 11 November
	status      thermal     works     the SoC's four temperature blocks read and published (tmu=3, a default; soc/drivers/core/hakios.exynos8890_tmu.c), the cores and the GPU cooled from them; seen on the phone, 9 November
